<!DOCTYPE html>
<!--
  GapWallet: the online half of zerogap. A watch-only Bitcoin wallet: it holds
  public keys, builds PSBTs for the offline signer, and broadcasts what comes
  back. It can't spend: no private key is ever in this page.

  This one file is the program, unminified. It is built from src/ and vendor/
  by tools/build.mjs; vendor/MANIFEST.json lists each bundled file's origin:
    zerogap's PSBT and BIP-32 libraries (GPL-3.0-or-later)
    @noble/hashes, @noble/secp256k1 (MIT, Paul Miller)
    qrcode-generator (MIT, Kazuhiko Arase; "QR Code" is a trademark of DENSO WAVE)
    jsQR (Apache-2.0, Cosmo Wolfe)
-->
