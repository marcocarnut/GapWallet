# Builds the site with node tools/build.mjs --dist and publishes it on GitHub
# Pages, at gapwallet.org. The site is dist/: index.html (the app), LICENSE,
# BUILD and the zip; BUILD says how to rebuild and compare.
#
# Actions are GitHub's own, pinned by commit (the tag beside each).
#
# SPDX-License-Identifier: GPL-3.0-or-later
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # The committed page must be what its sources build
      - run: node tools/build.mjs --check
      - run: node tools/build.mjs --dist
      # A release is built from the commit as it is: no "uncommitted changes"
      - run: "! grep -q 'uncommitted' dist/BUILD"
      # For GitHub Pages; the custom domain itself is set in the repository's
      # Settings, Pages (a workflow deploy doesn't read this file). Not in BUILD.
      - run: echo gapwallet.org > dist/CNAME
      - run: cd dist && sha256sum index.html LICENSE gapwallet-*.zip
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
